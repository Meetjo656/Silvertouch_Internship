<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Layout</title>
    <!-- Use Inter font for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>

<div class="chat-wrapper">
    <h1 class="chat-greeting">Hi Alex, how can I help you today?</h1>
    <div class="chat-messages" id="chat-messages">
        <!-- Messages will be injected here by JS -->
    </div>
    
    <div class="chat-input-container">
        <textarea id="chat-input" class="chat-textarea" placeholder="Ask anything"></textarea>
        
        <div class="chat-toolbar">
            <div class="toolbar-left">
                <button class="icon-btn plus-btn" aria-label="Add attachment">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 1V13M1 7H13" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                
                <button class="agent-btn" aria-label="Agent options">
                    <span class="search-icon">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 11C8.76142 11 11 8.76142 11 6C11 3.23858 8.76142 1 6 1C3.23858 1 1 3.23858 1 6C1 8.76142 3.23858 11 6 11Z" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M13 13L9.5 9.5" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="sparkle-icon">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M7 1L8.5 5.5L13 7L8.5 8.5L7 13L5.5 8.5L1 7L5.5 5.5L7 1Z" stroke="#2B2B2B" stroke-width="1.2" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="agent-text">Agent</span>
                </button>
            </div>
            
            <div class="toolbar-right">
                <button class="icon-btn" aria-label="Open chat">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 10.6667C14 11.403 13.403 12 12.6667 12H4L1.33333 14.6667V3.33333C1.33333 2.59695 1.93028 2 2.66667 2H12.6667C13.403 2 14 2.59695 14 3.33333V10.6667Z" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M5 6H10" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M5 9H8" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                
                <button class="icon-btn" aria-label="Use microphone">
                    <svg width="14" height="18" viewBox="0 0 14 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 11C8.65685 11 10 9.65685 10 8V4C10 2.34315 8.65685 1 7 1C5.34315 1 4 2.34315 4 4V8C4 9.65685 5.34315 11 7 11Z" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13 8V9C13 12.3137 10.3137 15 7 15C3.68629 15 1 12.3137 1 9V8" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 15V17" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                
                <button id="submit-btn" class="submit-btn" aria-label="Submit query">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1.5 7H12.5M12.5 7L7.5 2M12.5 7L7.5 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // Generate a unique session ID for this user session
    const sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
    
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const submitBtn = document.getElementById('submit-btn');

    function appendMessage(text, sender) {
        if (!text) return;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}-message`;
        msgDiv.innerText = text;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        
        appendMessage(text, 'user');
        chatInput.value = '';

        try {
            const response = await fetch('http://localhost:8000/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    text: text,
                    sessionId: sessionId,
                    workflowId: 'welcome-intent-anonymous' // Default workflow
                })
            });

            const data = await response.json();
            
            // Extract the bot's response from the resolution engine
            let botText = "Sorry, I didn't get that.";
            if (data.resolution && data.resolution.prompt) {
                botText = data.resolution.prompt;
            } else if (data.intent) {
                botText = `Detected Intent: ${data.intent} (Confidence: ${Math.round(data.confidence * 100)}%)`;
            }
            
            appendMessage(botText, 'bot');
        } catch (error) {
            console.error('Error:', error);
            appendMessage('Error connecting to the server. Is it running on port 8000?', 'bot');
        }
    }

    submitBtn.addEventListener('click', sendMessage);
    
    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
