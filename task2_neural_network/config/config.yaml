# Project Configuration

data:
  raw_image_dir: "data/raw/images"
  raw_mask_dir: "data/raw/masks"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  metadata_path: "data/metadata/dataset_metadata.json"

filtering:
  min_relative_area: 0.002

models:
  baseline:
    type: "random_forest"
    n_estimators: 100
    max_depth: null
    random_state: 42

blueprint:
  fill_internal_holes: true
  max_hole_area_ratio: 0.05
  
training:
  test_size: 0.2
  save_dir: "models/"
