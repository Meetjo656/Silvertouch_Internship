services:
  - type: web
    name: text-to-sql-rag-demo
    runtime: python
    rootDir: task4/deploy_demo
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: openai/gpt-oss-20b
